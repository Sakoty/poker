<html lang="ja">

.rank{

.suit{

.result{

.result h2{

padding:9px}
.panel{
padding:13px}
button{
width:100%;
margin:4px 0}

padding:15px 6px}
.playing-card{
width:64px;
height:96px}
.empty-card{
width:64px;
height:96px}

</style>
</head>
<body>
<header><h1>TEXAS HOLD'EM</h1><p>ONLINE · FREE PLAY (NO BETTING)</p></header>
<main>
<section class="panel" id="lobby">
<h2>プレイヤー設定</h2><input id="nameInput" maxlength="12" placeholder="プレイヤー名">
<div><button id="createBtn">ルームを作成</button></div><hr>
<input id="roomInput" maxlength="8" placeholder="ルームID"><div><button id="joinBtn" class="secondary">ルームに参加</button></div><p id="message" class="muted"></p>
</section>
<section class="panel hidden" id="gamePanel">
<h2>ゲームルーム</h2><p>ルームID</p><div class="room-code" id="roomCode"></div><button id="copyRoomBtn" class="secondary">IDをコピー</button>
<p id="gameStatus" class="status">接続中...</p><hr><h3>プレイヤー</h3><div class="players" id="players"></div>
<div class="table-area"><h3>コミュニティカード</h3><div id="communityCards" class="cards"></div><p id="stageLabel">カード配布前</p></div>
<section class="panel"><h3>あなたの手札</h3><div id="myCards" class="cards"></div><p id="myHandRank" class="status"></p></section>
<section class="result hidden" id="resultBox"><h2>ショーダウン結果</h2><p id="resultText"></p></section>
<div class="action-row"><button id="startBtn">ゲーム開始・配布</button><button id="flopBtn" class="secondary">フロップ公開</button><button id="turnBtn" class="secondary">ターン公開</button><button id="riverBtn" class="secondary">リバー公開</button><button id="showdownBtn" class="secondary">勝敗判定</button><button id="resetBtn" class="secondary">次のゲーム</button><button id="leaveBtn" class="danger">退出</button></div>
<p class="muted">各進行ボタンはホストのみ操作できます。</p>
</section></main><footer>Texas Hold'em Free Play · No chips or wagers</footer>
<script type="module">
import {
initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,ref,get,runTransaction,onValue}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={
apiKey:"AIzaSyDVkeLT4chg6nPCdzpec-XAqPVgrj_-w3A",authDomain:"porker-31a39.firebaseapp.com",projectId:"porker-31a",storageBucket:"porker-31a.firebasestorage.app",messagingSenderId:"506584003822",appId:"1:506584003822:web:260f5d4dba999e4e74efff",measurementId:"G-N6H6HVT0F4"}
;
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
let myId=sessionStorage.getItem("cardBattleTabPlayerId");
if(!myId){
myId=crypto.randomUUID();
sessionStorage.setItem("cardBattleTabPlayerId",myId)}
let myName="",roomId="",roomPath="",isHost=false,roomListener=null,busy=false;
const $=id=>document.getElementById(id);
function status(t){
$("gameStatus").textContent=t}
function message(t){
$("message").textContent=t}
function normalizeRoomId(v){
return String(v||"").trim().replace(/\s+/g,"").toUpperCase()}
function roomRef(){
if(!roomId)throw new Error("ルームIDが設定されていません");
if(!roomPath)roomPath=roomId;
return ref(db,roomPath)}
async function findRoomPath(code){
const root=await get(ref(db,code));
if(root.exists())return{
path:code,snapshot:root,format:"root"}
;
const legacyPath="rooms/"+code;
const legacy=await get(ref(db,legacyPath));
if(legacy.exists())return{
path:legacyPath,snapshot:legacy,format:"rooms"}
;
return{
path:code,snapshot:root,format:"missing"}
}
function createRoomCode(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let code="";
for(let i=0;
i<6;
i++)code+=chars[Math.floor(Math.random()*chars.length)];
return code}
function deckCreate(){
const suits=[{
s:"♠",c:"black"}
,{
s:"♥",c:"red"}
,{
s:"♦",c:"red"}
,{
s:"♣",c:"black"}
],ranks=[{
v:"2",n:2}
,{
v:"3",n:3}
,{
v:"4",n:4}
,{
v:"5",n:5}
,{
v:"6",n:6}
,{
v:"7",n:7}
,{
v:"8",n:8}
,{
v:"9",n:9}
,{
v:"10",n:10}
,{
v:"J",n:11}
,{
v:"Q",n:12}
,{
v:"K",n:13}
,{
v:"A",n:14}
];
let deck=[];
suits.forEach(s=>ranks.forEach(r=>deck.push({
suit:s.s,color:s.c,value:r.v,rank:r.n}
)));
for(let i=deck.length-1;
i>0;
i--){
let j=Math.floor(Math.random()*(i+1));
[deck[i],deck[j]]=[deck[j],deck[i]]}
return deck}
function cardHtml(card){
if(!card)return '<div class="empty-card"></div>';
const red=card.color==="red"?" red":"";
return `<div class="playing-card${
red}
"><span class="rank">${
card.value}
</span><span class="suit">${
card.suit}
</span></div>`}
function renderCards(container,cards,count=cards.length){
container.innerHTML="";
for(let i=0;
i<count;
i++){
container.insertAdjacentHTML("beforeend",cardHtml(cards[i]||null))}
}
function combinations(arr,k){
const out=[];
function walk(start,path){
if(path.length===k){
out.push(path.slice());
return}
for(let i=start;
i<arr.length;
i++){
path.push(arr[i]);
walk(i+1,path);
path.pop()}
}
walk(0,[]);
return out}
function scoreFive(cards){
const vals=cards.map(c=>c.rank).sort((a,b)=>b-a),counts={
}
;
cards.forEach(c=>counts[c.rank]=(counts[c.rank]||0)+1);
const groups=Object.entries(counts).map(([r,n])=>({
rank:Number(r),count:n}
)).sort((a,b)=>b.count-a.count||b.rank-a.rank);
const flush=cards.every(c=>c.suit===cards[0].suit);
let uniq=[...new Set(vals)].sort((a,b)=>b-a);
let straightHigh=0;
if(uniq.includes(14))uniq.push(1);
for(let i=0;
i<=uniq.length-5;
i++){
if(uniq[i]-uniq[i+4]===4){
straightHigh=uniq[i]===1?5:uniq[i];
break}
}
const tiebreak=[];
let category=0,label="ハイカード";
if(flush&&straightHigh===14){
category=9;
label="ロイヤルフラッシュ";
tiebreak.push(14)}
else if(flush&&straightHigh){
category=8;
label="ストレートフラッシュ";
tiebreak.push(straightHigh)}
else if(groups[0].count===4){
category=7;
label="フォーカード";
tiebreak.push(groups[0].rank,groups[1].rank)}
else if(groups[0].count===3&&groups[1].count===2){
category=6;
label="フルハウス";
tiebreak.push(groups[0].rank,groups[1].rank)}
else if(flush){
category=5;
label="フラッシュ";
tiebreak.push(...vals)}
else if(straightHigh){
category=4;
label="ストレート";
tiebreak.push(straightHigh)}
else if(groups[0].count===3){
category=3;
label="スリーカード";
tiebreak.push(groups[0].rank,...groups.slice(1).map(g=>g.rank))}
else if(groups[0].count===2&&groups[1].count===2){
category=2;
label="ツーペア";
tiebreak.push(groups[0].rank,groups[1].rank,groups[2].rank)}
else if(groups[0].count===2){
category=1;
label="ワンペア";
tiebreak.push(groups[0].rank,...groups.slice(1).map(g=>g.rank))}
else{
category=0;
label="ハイカード";
tiebreak.push(...vals)}
return{
category,label,tiebreak}
}
function compareScore(a,b){
if(a.category!==b.category)return a.category-b.category;
for(let i=0;
i<Math.max(a.tiebreak.length,b.tiebreak.length);
i++){
const x=a.tiebreak[i]||0,y=b.tiebreak[i]||0;
if(x!==y)return x-y}
return 0}
function bestHand(cards){
let best=null;
for(const five of combinations(cards,5)){
const s=scoreFive(five);
if(!best||compareScore(s,best.score)>0)best={
score:s,cards:five}
}
return best}
function evaluateRoom(room){
const community=room.community||[],players=room.players||{
}
;
const scores={
}
;
Object.keys(players).forEach(id=>{
const hole=players[id].hole||[];
if(hole.length===2&&community.length===5)scores[id]=bestHand(hole.concat(community))}
);
const ids=Object.keys(scores);
if(!ids.length)return"判定できるプレイヤーがいません";
let bestId=ids[0];
for(const id of ids.slice(1))if(compareScore(scores[id].score,scores[bestId].score)>0)bestId=id;
const winners=ids.filter(id=>compareScore(scores[id].score,scores[bestId].score)===0);
return winners.map(id=>`${
players[id].name}
（${
scores[id].score.label}
）`).join("、")+(winners.length>1?" の引き分け":" の勝利")}
function setControls(room){
const host=room.host===myId,stage=room.stage||"waiting";
$("startBtn").disabled=!host||stage!=="waiting"||Object.keys(room.players||{
}
).length<2;
$("flopBtn").disabled=!host||stage!=="preflop";
$ ("turnBtn").disabled=!host||stage!=="flop";
$ ("riverBtn").disabled=!host||stage!=="turn";
$ ("showdownBtn").disabled=!host||stage!=="river";
$ ("resetBtn").disabled=!host||!(["showdown","finished"].includes(stage));
}
function render(room){
const players=room.players||{
}
,ids=Object.keys(players),stage=room.stage||"waiting";
$("players").innerHTML="";
ids.forEach(id=>{
const p=players[id],box=document.createElement("div");
box.className="player"+(id===myId?" me":"");
const nm=document.createElement("div");
nm.className="player-name";
nm.textContent=p.name+(id===room.host?" 👑":"");
const meta=document.createElement("div");
meta.className="player-meta";
meta.textContent=id===myId?"あなた":"参加者";
box.append(nm,meta);
if(stage==="showdown"||stage==="finished"){
const cards=document.createElement("div");
cards.className="cards";
cards.innerHTML=(p.hole||[]).map(cardHtml).join("");
box.appendChild(cards);
if(p.handLabel){
const rank=document.createElement("p");
rank.className="status";
rank.textContent=p.handLabel;
box.appendChild(rank)}
}
else{
const backs=document.createElement("div");
backs.className="cards";
backs.innerHTML='<div class="playing-card back">◆</div><div class="playing-card back">◆</div>';
box.appendChild(backs)}
$("players").appendChild(box)}
);
const community=room.community||[];
renderCards($("communityCards"),community,5);
$("stageLabel").textContent=({
waiting:"参加者募集中",preflop:"プリフロップ：手札配布済み",flop:"フロップ：共有カード3枚",turn:"ターン：共有カード4枚",river:"リバー：共有カード5枚",showdown:"ショーダウン",finished:"ラウンド終了"}
)[stage]||stage;
const me=players[myId];
renderCards($("myCards"),me?.hole||[],2);
$("myHandRank").textContent=(stage==="showdown"||stage==="finished")?(me?.handLabel||""):me?.hole?.length?"手札が配られました":"まだカードは配られていません";
const host=room.host===myId;
isHost=host;
status(`${
stage.toUpperCase()}
· ${
ids.length}
/ 8人`);
setControls(room);
if(stage==="showdown"||stage==="finished"){
$("resultBox").classList.remove("hidden");
$("resultText").textContent=room.result||"判定済み"}
else{
$("resultBox").classList.add("hidden")}
}
function enterRoom(){
$("lobby").classList.add("hidden");
$("gamePanel").classList.remove("hidden");
$("roomCode").textContent=roomId;
if(roomListener)roomListener();
roomListener=onValue(roomRef(),snap=>{
if(!snap.exists()){
status("ルームが終了しました");
return}
render(snap.val())}
,err=>{
console.error(err);
status("同期エラー："+(err.code||err.message))}
)}
$("createBtn").onclick=async()=>{
if(busy)return;
myName=$("nameInput").value.trim();
if(!myName){
message("プレイヤー名を入力してください");
return}
busy=true;
$("createBtn").disabled=true;
$ ("joinBtn").disabled=true;
message("ルーム作成中...");
try{
let made=false;
for(let tries=0;
tries<5;
tries++){
roomId=createRoomCode();
roomPath=roomId;
const data={
host:myId,state:"waiting",stage:"waiting",createdAt:Date.now(),round:0,community:[],deck:null,result:"",players:{
[myId]:{
name:myName,joinedAt:Date.now(),hole:[],handLabel:""}
}
}
;
const tx=await runTransaction(ref(db,roomPath),old=>old===null?data:undefined);
if(tx.committed){
made=true;
break}
}
if(!made){
message("ルーム作成に失敗しました。Rulesを確認してください");
return}
isHost=true;
enterRoom()}
catch(e){
console.error(e);
message("作成エラー："+e.message)}
finally{
busy=false;
$ ("createBtn").disabled=false;
$ ("joinBtn").disabled=false}
}
;
$("joinBtn").onclick=async()=>{
if(busy)return;
myName=$("nameInput").value.trim();
roomId=normalizeRoomId($("roomInput").value);
$("roomInput").value=roomId;
if(!myName||!roomId){
message("名前とルームIDを入力してください");
return}
busy=true;
$ ("joinBtn").disabled=true;
$ ("createBtn").disabled=true;
message("ルーム確認中...");
try{
const found=await findRoomPath(roomId);
roomPath=found.path;
const room=found.snapshot.val();
if(!found.snapshot.exists()){
message("ルームが見つかりません");
return}
if(room.stage!=="waiting"){
message("このルームはすでに開始されています");
return}
const tx=await runTransaction(ref(db,roomPath),current=>{
if(current===null)return null;
if(current.stage!=="waiting")return;
current.players=current.players||{
}
;
if(current.players[myId]){
current.players[myId].name=myName;
return current}
if(Object.keys(current.players).length>=8)return;
current.players[myId]={
name:myName,joinedAt:Date.now(),hole:[],handLabel:""}
;
return current}
,{
applyLocally:false}
);
if(!tx.committed||!tx.snapshot.val()?.players?.[myId]){
message("参加に失敗しました。ID重複・満員・Rulesを確認してください");
console.warn("join failed",{
roomId,roomPath,committed:tx.committed,snapshot:tx.snapshot.val()}
);
return}
isHost=tx.snapshot.val().host===myId;
enterRoom()}
catch(e){
console.error(e);
message("参加エラー："+(e.code||e.message))}
finally{
busy=false;
$ ("joinBtn").disabled=false;
$ ("createBtn").disabled=false}
}
;
async function hostTransaction(fn,failText){
if(!isHost||busy)return;
busy=true;
try{
const tx=await runTransaction(roomRef(),room=>{
if(!room||room.host!==myId)return;
return fn(room)}
);
if(!tx.committed)status(failText)}
catch(e){
console.error(e);
status("処理エラー："+(e.code||e.message))}
finally{
busy=false}
}
$("startBtn").onclick=()=>hostTransaction(room=>{
if(room.stage!=="waiting")return;
const ids=Object.keys(room.players||{
}
);
if(ids.length<2||ids.length>8)return;
const deck=deckCreate();
ids.forEach(id=>room.players[id].hole=[deck.pop(),deck.pop()]);
room.deck=deck;
room.community=[];
room.result="";
room.stage="preflop";
room.round=(room.round||0)+1;
return room}
,"開始できませんでした");
$("flopBtn").onclick=()=>hostTransaction(room=>{
if(room.stage!=="preflop"||!room.deck)return;
room.deck.splice(0,1);
room.community=room.deck.splice(0,3);
room.stage="flop";
return room}
,"フロップを公開できませんでした");
$("turnBtn").onclick=()=>hostTransaction(room=>{
if(room.stage!=="flop"||!room.deck)return;
room.deck.splice(0,1);
room.community.push(room.deck.pop());
room.stage="turn";
return room}
,"ターンを公開できませんでした");
$("riverBtn").onclick=()=>hostTransaction(room=>{
if(room.stage!=="turn"||!room.deck)return;
room.deck.splice(0,1);
room.community.push(room.deck.pop());
room.stage="river";
return room}
,"リバーを公開できませんでした");
$("showdownBtn").onclick=()=>hostTransaction(room=>{
if(room.stage!=="river"||room.community.length!==5)return;
const ps=room.players||{
}
,scores={
}
;
Object.keys(ps).forEach(id=>{
const seven=(ps[id].hole||[]).concat(room.community);
if(seven.length===7){
const best=bestHand(seven);
scores[id]=best;
ps[id].handLabel=best.score.label}
}
);
const ids=Object.keys(scores);
if(!ids.length)return;
let leader=ids[0];
ids.slice(1).forEach(id=>{
if(compareScore(scores[id].score,scores[leader].score)>0)leader=id}
);
const wins=ids.filter(id=>compareScore(scores[id].score,scores[leader].score)===0);
room.result=wins.map(id=>`${
ps[id].name}
（${
scores[id].score.label}
）`).join("、")+(wins.length>1?" の引き分け":" の勝利");
room.stage="showdown";
return room}
,"勝敗判定できませんでした");

if(!["showdown","finished"].includes(room.stage))return;
Object.values(room.players||{
}
).forEach(p=>{
p.hole=[];
p.handLabel=""}
);
room.community=[];
room.deck=null;
room.result="";
room.stage="waiting";
return room}
,"次のゲームに戻れませんでした");
$("copyRoomBtn").onclick=async()=>{
try{
await navigator.clipboard.writeText(roomId);
status("ルームIDをコピーしました")}
catch{
status("コピーできませんでした")}
}
;
$("leaveBtn").onclick=async()=>{
if(busy)return;
busy=true;
try{
await runTransaction(roomRef(),room=>{
if(!room?.players?.[myId])return;
delete room.players[myId];

room.stage="closed";
room.state="closed";
room.result="全員退出しました";

if(room.host===myId)room.host=ids[0];
if(ids.length<2&&room.stage!=="waiting"){
room.stage="waiting";

room.deck=null;
room.result="";
ids.forEach(id=>{
room.players[id].hole=[];
room.players[id].handLabel=""}
)}
