
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Card Battle</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #071811;
  color: #f4f5ee;
  font-family: system-ui, sans-serif;
}

header {
  text-align: center;
  padding: 24px 12px;
  background: #0b2417;
  border-bottom: 1px solid #294d35;
}

h1 {
  margin: 0;
  color: #d8c17b;
  letter-spacing: 4px;
}

main {
  width: min(900px, 100%);
  margin: auto;
  padding: 18px;
}

.panel {
  background: #102d1d;
  border: 1px solid #294d35;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

input {
  width: 100%;
  max-width: 400px;
  padding: 13px;
  margin: 6px 0;
  border: 1px solid #35563d;
  border-radius: 9px;
  background: #081b11;
  color: white;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 13px 18px;
  margin: 5px 3px;
  background: #d5bd77;
  color: #152519;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.secondary {
  background: #244c34;
  color: white;
}

.danger {
  background: #8f3d3d;
  color: white;
}

.hidden {
  display: none !important;
}

.muted {
  color: #96ad9b;
}

.status {
  color: #e0cb8a;
  font-weight: bold;
}

.room-code {
  font-size: 25px;
  letter-spacing: 4px;
  color: #e0cb8a;
  word-break: break-all;
}

.players {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 12px;
}

.player {
  background: #183b26;
  border: 1px solid #345b40;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
}

.player.me {
  border: 2px solid #d6bd77;
}

.player-name {
  font-weight: bold;
  overflow-wrap: anywhere;
}

.player-meta {
  font-size: 12px;
  color: #a6baa8;
  margin-top: 5px;
}

.card {
  width: 84px;
  height: 118px;
  border-radius: 12px;
  background: white;
  color: #202020;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px auto;
  font-size: 32px;
  font-weight: bold;
  box-shadow: 0 5px 12px #0005;
}

.card.red {
  color: #d42d40;
}

.card-back {
  background: linear-gradient(135deg, #244d36, #102719);
  color: #d6bd77;
  border: 3px solid #d6bd77;
}

.result {
  text-align: center;
  padding: 18px;
  border-radius: 12px;
  background: #183b25;
  margin-top: 14px;
}

.result h2 {
  color: #f2d98d;
}

.actions {
  text-align: center;
  margin-top: 18px;
}

footer {
  text-align: center;
  color: #78927e;
  padding: 20px;
  font-size: 12px;
}

@media (max-width: 480px) {
  main {
    padding: 10px;
  }

  .panel {
    padding: 15px;
  }

  h1 {
    font-size: 23px;
  }

  button {
    width: 100%;
    margin: 5px 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>CARD BATTLE</h1>
  <p>ONLINE MULTIPLAYER</p>
</header>

<main>

<section class="panel" id="lobby">
  <h2>プレイヤー設定</h2>

  <input id="nameInput" maxlength="12" placeholder="プレイヤー名">

  <div>
    <button id="createBtn">ルームを作成</button>
  </div>

  <hr>

  <input id="roomInput" maxlength="8" placeholder="ルームID">

  <div>
    <button id="joinBtn" class="secondary">ルームに参加</button>
  </div>

  <p id="message" class="muted"></p>
</section>

<section class="panel hidden" id="gamePanel">

  <h2>ゲームルーム</h2>

  <p>ルームID</p>
  <div class="room-code" id="roomCode"></div>

  <button id="copyRoomBtn" class="secondary">IDをコピー</button>

  <p id="gameStatus" class="status">接続中...</p>

  <hr>

  <h3>プレイヤー一覧</h3>
  <div class="players" id="players"></div>

  <section class="result hidden" id="resultBox">
    <h2>結果</h2>
    <p id="resultText"></p>
  </section>

  <div class="actions">
    <button id="startBtn">カード勝負を開始</button>
    <button id="resetBtn" class="secondary">次の勝負</button>
    <button id="leaveBtn" class="danger">退出</button>
  </div>

</section>

</main>

<footer>Online Card Battle · Free Play</footer>

<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  runTransaction,
  onValue
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* Firebase設定 */
const firebaseConfig = {
  apiKey: "AIzaSyDVkeLT4chg6nPCdzpec-XAqPVgrj_-w3A",
  authDomain: "porker-31a39.firebaseapp.com",
  projectId: "porker-31a39",
  storageBucket: "porker-31a39.firebasestorage.app",
  messagingSenderId: "506584003822",
  appId: "1:506584003822:web:260f5d4dba999e4e74efff",
  measurementId: "G-N6H6HVT0F4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* プレイヤー情報 */
let myId = localStorage.getItem("cardBattlePlayerId");

if (!myId) {
  myId = crypto.randomUUID();
  localStorage.setItem("cardBattlePlayerId", myId);
}

let myName = "";
let roomId = "";
let isHost = false;
let roomListener = null;
let busy = false;

const $ = id => document.getElementById(id);

function status(text) {
  $("gameStatus").textContent = text;
}

function message(text) {
  $("message").textContent = text;
}

function roomRef() {
  return ref(db, "rooms/" + roomId);
}

/* ルームID生成 */
function createRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";

  for (let i = 0; i < 6; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }

  return code;
}

/* デッキ作成 */
function createDeck() {
  const suits = [
    { symbol: "♠", color: "black" },
    { symbol: "♥", color: "red" },
    { symbol: "♦", color: "red" },
    { symbol: "♣", color: "black" }
  ];

  const ranks = [
    { value: "2", rank: 2 },
    { value: "3", rank: 3 },
    { value: "4", rank: 4 },
    { value: "5", rank: 5 },
    { value: "6", rank: 6 },
    { value: "7", rank: 7 },
    { value: "8", rank: 8 },
    { value: "9", rank: 9 },
    { value: "10", rank: 10 },
    { value: "J", rank: 11 },
    { value: "Q", rank: 12 },
    { value: "K", rank: 13 },
    { value: "A", rank: 14 }
  ];

  const deck = [];

  suits.forEach(suit => {
    ranks.forEach(rank => {
      deck.push({
        symbol: suit.symbol,
        color: suit.color,
        value: rank.value,
        rank: rank.rank
      });
    });
  });

  /* シャッフル */
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }

  return deck;
}

/* ルーム作成 */
$("createBtn").onclick = async () => {
  if (busy) return;

  myName = $("nameInput").value.trim();

  if (!myName) {
    message("プレイヤー名を入力してください。");
    return;
  }

  busy = true;
  message("作成中...");

  try {
    let success = false;

    for (let i = 0; i < 5; i++) {
      roomId = createRoomCode();

      const roomData = {
        host: myId,
        state: "waiting",
        createdAt: Date.now(),
        round: 0,
        result: "",
        players: {
          [myId]: {
            name: myName,
            joinedAt: Date.now(),
            card: null
          }
        }
      };

      const result = await runTransaction(
        ref(db, "rooms/" + roomId),
        current => current === null ? roomData : undefined
      );

      if (result.committed) {
        success = true;
        break;
      }
    }

    if (!success) {
      message("ルームを作成できませんでした。");
      return;
    }

    isHost = true;
    enterRoom();

  } catch (e) {
    console.error(e);
    message("エラー: " + e.message);

  } finally {
    busy = false;
  }
};

/* ルーム参加 */
$("joinBtn").onclick = async () => {
  if (busy) return;

  myName = $("nameInput").value.trim();
  roomId = $("roomInput").value.trim().toUpperCase();

  if (!myName || !roomId) {
    message("名前とIDを入力してください。");
    return;
  }

  busy = true;
  message("参加中...");

  try {
    const result = await runTransaction(roomRef(), room => {
      if (!room || room.state !== "waiting") return;

      room.players = room.players || {};

      if (room.players[myId]) {
        room.players[myId].name = myName;
        return room;
      }

      if (Object.keys(room.players).length >= 8) return;

      room.players[myId] = {
        name: myName,
        joinedAt: Date.now(),
        card: null
      };

      return room;
    });

    if (!result.committed) {
      message("参加できません。ルーム不存在・満員・開始済みの可能性があります。");
      return;
    }

    isHost = result.snapshot.val().host === myId;
    enterRoom();

  } catch (e) {
    console.error(e);
    message("参加エラー: " + e.message);

  } finally {
    busy = false;
  }
};

/* 入室 */
function enterRoom() {
  $("lobby").classList.add("hidden");
  $("gamePanel").classList.remove("hidden");
  $("roomCode").textContent = roomId;

  if (roomListener) roomListener();

  roomListener = onValue(roomRef(), snapshot => {
    if (!snapshot.exists()) {
      status("ルームが終了しました。");
      return;
    }

    render(snapshot.val());
  });
}

/* 描画 */
function render(room) {
  const players = room.players || {};
  const ids = Object.keys(players);

  $("players").innerHTML = "";

  ids.forEach(id => {
    const player = players[id];
    const box = document.createElement("div");

    box.className = "player" + (id === myId ? " me" : "");

    const name = document.createElement("div");
    name.className = "player-name";
    name.textContent = player.name + (id === room.host ? " 👑" : "");

    const meta = document.createElement("div");
    meta.className = "player-meta";
    meta.textContent = id === myId ? "あなた" : "プレイヤー";

    box.appendChild(name);
    box.appendChild(meta);

    if (player.card && room.state === "finished") {
      const card = document.createElement("div");
      card.className = "card" + (player.card.color === "red" ? " red" : "");
      card.textContent = player.card.symbol + player.card.value;
      box.appendChild(card);
    } else {
      const card = document.createElement("div");
      card.className = "card card-back";
      card.textContent = "?";
      box.appendChild(card);
    }

    $("players").appendChild(box);
  });

  isHost = room.host === myId;

  if (room.state === "waiting") {
    status("参加者募集中 · " + ids.length + " / 8人");
    $("resultBox").classList.add("hidden");
  }

  if (room.state === "finished") {
    status("ゲーム終了");
    $("resultBox").classList.remove("hidden");
    $("resultText").textContent = room.result || "";
  }

  $("startBtn").disabled =
    !isHost || room.state !== "waiting" || ids.length < 2;

  $("resetBtn").disabled =
    !isHost || room.state !== "finished";
}

/* ゲーム開始 */
$("startBtn").onclick = async () => {
  if (!isHost || busy) return;

  busy = true;

  try {
    const result = await runTransaction(roomRef(), room => {
      if (!room || room.host !== myId || room.state !== "waiting") return;

      const ids = Object.keys(room.players || {});

      if (ids.length < 2 || ids.length > 8) return;

      const deck = createDeck();

      ids.forEach((id, i) => {
        room.players[id].card = deck[i];
      });

      const maxRank = Math.max(
        ...ids.map(id => room.players[id].card.rank)
      );

      const winners = ids
        .filter(id => room.players[id].card.rank === maxRank)
        .map(id => room.players[id].name);

      room.state = "finished";
      room.round = (room.round || 0) + 1;

      room.result = winners.length > 1
        ? "引き分け: " + winners.join(" / ")
        : "勝者: " + winners[0];

      room.finishedAt = Date.now();

      return room;
    });

    if (!result.committed) {
      status("開始できませんでした。");
    }

  } catch (e) {
    console.error(e);
    status("開始エラー");

  } finally {
    busy = false;
  }
};

/* 再戦 */
$("resetBtn").onclick = async () => {
  if (!isHost || busy) return;

  busy = true;

  try {
    const result = await runTransaction(roomRef(), room => {
      if (!room || room.host !== myId || room.state !== "finished") return;

      Object.values(room.players || {}).forEach(player => {
        player.card = null;
      });

      room.state = "waiting";
      room.result = "";
      room.finishedAt = null;

      return room;
    });

    if (!result.committed) {
      status("再戦できませんでした。");
    }

  } catch (e) {
    console.error(e);
    status("再戦エラー");

  } finally {
    busy = false;
  }
};

/* IDコピー */
$("copyRoomBtn").onclick = async () => {
  try {
    await navigator.clipboard.writeText(roomId);
    status("ルームIDをコピーしました。");
  } catch {
    status("コピーに失敗しました。");
  }
};

/* 退出 */
$("leaveBtn").onclick = async () => {
  if (busy) return;

  busy = true;

  try {
    await runTransaction(roomRef(), room => {
      if (!room || !room.players || !room.players[myId]) return;

      delete room.players[myId];

      const ids = Object.keys(room.players);

      if (ids.length === 0) {
        room.state = "closed";
        room.result = "全員退出しました。";
        return room;
      }

      if (room.host === myId) {
        room.host = ids[0];
      }

      if (room.state === "finished" && ids.length < 2) {
        room.state = "waiting";
        room.result = "人数不足のため終了しました。";

        ids.forEach(id => {
          room.players[id].card = null;
        });
      }

      return room;
    });

    if (roomListener) {
      roomListener();
      roomListener = null;
    }

    location.reload();

  } catch (e) {
    console.error(e);
    status("退出エラー");

  } finally {
    busy = false;
  }
};

</script>
</body>
</html>
